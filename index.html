<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurante Sabor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href=".../bootstrap.min.css"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    
</head>
<body>
    <header>
        <h1> Restaurante Sabor</h1>
        <nav>...</nav>
    </header>
    <main>
        <section id="menu">
            <h2>Nuestro menu</h2>
        </section>
        <section id="nosotros">...</section>
    </main>
    <section id="pedidos" class="container my-S">
        <h2>Registrar Pedido</h2>
        <form id="form-pedido" class="2row g-3">
            <div class="col-md-4">
                <label class="form-label">Cliente</label>
                <input id="nombre" class="form-control">
            </div>
            <div class="col-md-4">
                <select id="plato" class="form-select">
                </select>
            </div>
            <div class="col-md-4">
                <input id="cantidad" type="number" class="form-control">
            </div>
            <button id="btn-agregar" type="button" class="btn.primary">
                Agregar
            </button>
        </form>

        <table class="table table-striped mt-4">
            <thead>
                <tr><th>Cliente</th>
                <th>Plato</th>
                <th>Cant.</th></tr>
            </thead>
            <tbody id="tabla-pedidos"></tbody>
        </table>

    <footer>...</footer>
    <img src="img\images.jpg">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/data.js"></script> <!-- Modelo-->
    <script src="js/app.js"></script> <!-- Controlador-->
</body>
</html>
